<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP Component</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #6E7F99; 
            --primary-dark: #5A6A82;
            --secondary: #FDFBF7; 
            --accent: #E5D9C5; 
            --text-dark: #333333;
            --text-light: #5A6673;
            --font-serif: 'Playfair Display', serif;
            --font-sans: 'Lato', sans-serif;
            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-sans); color: var(--text-dark); background-color: transparent; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        h3, h4 { font-family: var(--font-serif); font-weight: 400; }
        .btn { padding: 15px 40px; border: none; background: var(--primary); color: white; font-family: var(--font-sans); text-transform: uppercase; letter-spacing: 2px; font-size: 0.9rem; cursor: pointer; border-radius: 30px; transition: var(--transition); text-decoration: none; display: inline-block; }
        .btn:hover { background: var(--primary-dark); transform: translateY(-3px); box-shadow: 0 10px 20px rgba(110, 127, 153, 0.3); }
        .rsvp-card { position: relative; width: 100%; max-width: 650px; background: rgba(255, 255, 255, 0.95); padding: 40px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.05); border: 1px solid rgba(255,255,255,0.8); text-align: center; }
        .form-group { margin-bottom: 25px; text-align: left; }
        .form-group label { display: block; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: var(--primary); margin-bottom: 8px; }
        .form-control { width: 100%; padding: 12px 15px; background: #fff; border: 1px solid #ddd; border-radius: 5px; font-family: var(--font-sans); transition: var(--transition); }
        .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(110, 127, 153, 0.2); }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        textarea.form-control { resize: vertical; min-height: 100px; }
        .radio-group { display: flex; gap: 20px; margin-top: 5px; }
        .radio-label { display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text-light); }
        .modal-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.98); backdrop-filter: blur(8px); border-radius: 20px; z-index: 10; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px; text-align: center; transition: var(--transition); }
        .modal-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .code-input { font-size: 2rem; text-align: center; letter-spacing: 5px; text-transform: uppercase; max-width: 260px; margin: 20px 0; border: none; border-bottom: 2px solid var(--primary); background: transparent; outline: none; color: var(--primary-dark); }
        .error-msg { color: #d9534f; font-size: 0.9rem; margin-top: 10px; height: 20px; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid var(--primary); border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: none; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @media (max-width: 600px) { .row { grid-template-columns: 1fr; gap: 0; } .rsvp-card { padding: 25px 15px; } }
    </style>
</head>
<body>

    <div class="rsvp-card">
        <!-- Private Invitation Step -->
        <div class="modal-overlay" id="verificationModal">
            <h3 style="font-size: 1.6rem; color: var(--primary); margin-bottom: 10px;">Private Invitation</h3>
            <p style="color: var(--text-light); font-size: 0.95rem; margin-bottom: 15px;">Please enter your unique invitation code to unlock your RSVP.</p>
            <input type="text" id="invitationCode" class="code-input" placeholder="CODE" autocomplete="off">
            <div id="verifyLoader" class="loader"></div>
            <p class="error-msg" id="verifyError"></p>
            <button class="btn" id="verifyBtn" style="margin-top: 15px;">Unlock RSVP</button>
        </div>

        <!-- Success Message Step -->
        <div class="modal-overlay hidden" id="successModal">
            <h3 style="font-size: 2.2rem; color: var(--primary); margin-bottom: 15px;">Thank You!</h3>
            <p style="color: var(--text-light); font-size: 1.05rem;">Your response has been beautifully recorded.</p>
            <p style="margin-top: 15px; font-style: italic; color: var(--primary);">We can't wait to celebrate with you.</p>
        </div>

        <!-- Core RSVP Form Layout -->
        <form id="rsvpForm">
            <div class="form-group" style="text-align: center; margin-bottom: 20px;">
                <h4 id="welcomeMessage" style="font-size: 1.3rem; color: var(--primary);"></h4>
            </div>

            <input type="hidden" id="finalCode" name="code">

            <div class="form-group">
                <label>Guest Name</label>
                <input type="text" id="guestName" class="form-control" placeholder="Your Name" required>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone" class="form-control" required>
                </div>
            </div>

            <div class="form-group">
                <label>Will you attend?</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="attendance" value="Joyfully Accepts" required> Joyfully Accepts
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="attendance" value="Regretfully Declines"> Regretfully Declines
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>Message for the Couple</label>
                <textarea id="message" class="form-control" placeholder="Leave a wedding wish..."></textarea>
            </div>

            <div style="text-align: center;">
                <div id="submitLoader" class="loader" style="margin-bottom: 15px;"></div>
                <button type="submit" class="btn" id="submitBtn" style="width: 100%;">Submit RSVP</button>
            </div>
        </form>
    </div>

    <script>
        // Make sure to paste your actual deployed URL here
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxOV9G2QrKPM8LomFp19c5djZWGzxWEPitF4dXwd76rEi73alzCCf0SHIIU5exduYqOWA/exec";
        
        const verifyModal = document.getElementById('verificationModal');
        const successModal = document.getElementById('successModal');
        const rsvpForm = document.getElementById('rsvpForm');
        const verifyBtn = document.getElementById('verifyBtn');
        const codeInput = document.getElementById('invitationCode');
        const verifyLoader = document.getElementById('verifyLoader');
        const verifyError = document.getElementById('verifyError');
        const submitBtn = document.getElementById('submitBtn');
        const submitLoader = document.getElementById('submitLoader');

        verifyBtn.addEventListener('click', async () => {
            const code = codeInput.value.trim();
            if(!code) { verifyError.innerText = "Please enter a code."; return; }

            verifyBtn.style.display = 'none';
            verifyLoader.style.display = 'block';
            verifyError.innerText = "";

            const details = { action: 'verify', code: code };
            const formBody = Object.keys(details).map(key => encodeURIComponent(key) + '=' + encodeURIComponent(details[key])).join('&');

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'cors',
                    redirect: 'follow',
                    body: formBody,
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' }
                });
                const result = await response.json();
                if (result.status === "success") {
                    document.getElementById('finalCode').value = code;
                    document.getElementById('guestName').value = result.name;
                    document.getElementById('welcomeMessage').innerText = result.message;
                    verifyModal.classList.add('hidden');
                } else {
                    verifyError.innerText = result.message;
                    verifyBtn.style.display = 'inline-block';
                }
            } catch (error) {
                verifyError.innerText = "Connection error. Please check your setup.";
                verifyBtn.style.display = 'inline-block';
            } finally {
                verifyLoader.style.display = 'none';
            }
        });

        rsvpForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.style.display = 'none';
            submitLoader.style.display = 'block';

            const payload = {
                action: "rsvp",
                code: document.getElementById('finalCode').value,
                name: document.getElementById('guestName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                attendance: document.querySelector('input[name="attendance"]:checked').value,
                message: document.getElementById('message').value
            };

            const formBody = Object.keys(payload).map(key => encodeURIComponent(key) + '=' + encodeURIComponent(payload[key])).join('&');

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'cors',
                    redirect: 'follow',
                    body: formBody,
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' }
                });
                const result = await response.json();
                if (result.status === "success") {
                    successModal.classList.remove('hidden');
                    if(payload.attendance === "Joyfully Accepts") {
                        confetti({ startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999, particleCount: 150, origin: { x: 0.5, y: 0.5 } });
                    }
                    // Auto refresh after 1 minute to clear the view
                    setTimeout(() => { window.location.reload(); }, 60000);
                } else {
                    alert("Error: " + result.message);
                    submitBtn.style.display = 'inline-block';
                }
            } catch (error) {
                alert("Submission failed. Please check your connection.");
                submitBtn.style.display = 'inline-block';
            } finally {
                submitLoader.style.display = 'none';
            }
        });
    </script>
</body>
</html>
