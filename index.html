<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rey & Jona — Wedding</title>
    <meta name="description" content="You are cordially invited to celebrate the wedding of Rey and Jona.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Allura&family=Great+Vibes&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Parisienne&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- GSAP (Animation Library) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>

<body>

    <!-- ============================= -->
    <!-- LANDING PAGE (Full Screen)    -->
    <!-- ============================= -->
    <section id="landing" class="landing">
        <!-- Dusty blue textured background -->
        <div class="landing__bg"></div>

        <!-- Floral decorations -->
        <img src="assets/top-left-corner-flower.png" alt="" class="landing__flower landing__flower--top-left" aria-hidden="true">
        <img src="assets/right-edge-flower.png" alt="" class="landing__flower landing__flower--right-edge" aria-hidden="true">
        <img src="assets/left-edge-flower.png" alt="" class="landing__flower landing__flower--left-edge" aria-hidden="true">
        <img src="assets/bottom-right-corner-flower.png" alt="" class="landing__flower landing__flower--bottom-right" aria-hidden="true">

        <!-- Center content -->
        <div class="landing__content">
            <p class="landing__prefix">THE WEDDING OF</p>
            <h1 class="landing__names">
                <span class="landing__name">Rey</span>
                <span class="landing__ampersand">&</span>
                <span class="landing__name">Jona</span>
            </h1>
            <p class="landing__date">December 28, 2026</p>
            <div class="landing__divider"></div>
            <button id="enter-btn" class="landing__enter" aria-label="Enter the wedding website">
                <span class="landing__enter-text">View Our Invitation</span>
                <svg class="landing__enter-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </button>
        </div>
    </section>

    <!-- ============================= -->
    <!-- MAIN CONTENT                  -->
    <!-- ============================= -->
    <main id="main-content" class="main-content">
        <!-- Main website content will go here -->
        <section class="hero-placeholder">
            <h2 class="font-primary" style="font-size: var(--text-hero-title); text-align: center; padding: 2rem;">
                Welcome
            </h2>
            <p style="text-align: center; font-size: var(--text-body); max-width: 600px; margin: 0 auto; padding: 0 1.5rem 4rem;">
                We are so excited to celebrate this special day with you. More details coming soon.
            </p>
        </section>
    </main>

    <!-- Custom JavaScript -->
    <script src="script.js"></script>
</body>

</html>
