<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rey & Jona — Coming Soon</title>
  <meta name="description" content="Something beautiful is on its way. Rey & Jona's wedding website is coming soon.">
  <link rel="icon" type="image/png" sizes="96x96" href="assets/favicon/favicon-96x96.png">
  <link rel="icon" href="assets/favicon/favicon.svg" type="image/svg+xml" sizes="any">
  <link rel="icon" href="assets/favicon/favicon.ico">
  <link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
  <link rel="manifest" href="assets/favicon/site.webmanifest">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400;500&display=swap"
    rel="stylesheet">

  <style>
    /* ─── Color Palette ─────────────────────────────────────── */
    :root {
      --ash-grey: #B6BBB5;
      --pale-peach: #EEDAC9;
      --powder-blue: #B6C7DB;
      --dusty-blue: #6E8FB3;
      --dusk-blue: #365583;
      --baltic-blue: #3F618E;
    }

    /* ─── Font Face ─────────────────────────────────────────── */
    @font-face {
      font-family: 'Tangier';
      src: url('assets/font/Tangier.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    /* ─── Reset & Base ──────────────────────────────────────── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #FAF6F1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      position: relative;
    }

    /* ─── Soft Ambient Background ───────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 60% at 15% 10%, rgba(182, 199, 219, 0.28) 0%, transparent 65%),
        radial-gradient(ellipse 55% 50% at 88% 85%, rgba(238, 218, 201, 0.45) 0%, transparent 60%),
        radial-gradient(ellipse 60% 70% at 90% 5%, rgba(110, 143, 179, 0.10) 0%, transparent 60%),
        radial-gradient(ellipse 80% 80% at 50% 50%, rgba(250, 246, 241, 1) 0%, rgba(245, 238, 228, 0.85) 100%);
      z-index: 0;
    }

    /* ─── Decorative Corner Flourishes ─────────────────────── */
    .corner {
      position: fixed;
      width: 180px;
      height: 180px;
      z-index: 1;
      opacity: 0.18;
    }

    .corner svg {
      width: 100%;
      height: 100%;
    }

    .corner--tl {
      top: -10px;
      left: -10px;
      transform: rotate(0deg);
    }

    .corner--tr {
      top: -10px;
      right: -10px;
      transform: rotate(90deg);
    }

    .corner--bl {
      bottom: -10px;
      left: -10px;
      transform: rotate(270deg);
    }

    .corner--br {
      bottom: -10px;
      right: -10px;
      transform: rotate(180deg);
    }

    /* ─── Floating Petals ───────────────────────────────────── */
    .petals-canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .petal {
      position: absolute;
      top: -40px;
      width: 10px;
      height: 14px;
      border-radius: 80% 20% 80% 20%;
      opacity: 0;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(-40px) rotate(0deg) translateX(0px);
        opacity: 0;
      }

      5% {
        opacity: 0.55;
      }

      90% {
        opacity: 0.4;
      }

      100% {
        transform: translateY(110vh) rotate(720deg) translateX(60px);
        opacity: 0;
      }
    }

    /* ─── Main Card ─────────────────────────────────────────── */
    .card {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 24px;
      max-width: 680px;
      width: 100%;
      animation: fadeUp 1.4s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ─── Decorative Line ───────────────────────────────────── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 320px;
      margin-bottom: 28px;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--dusty-blue), transparent);
      opacity: 0.45;
    }

    .divider-diamond {
      width: 6px;
      height: 6px;
      background: var(--dusty-blue);
      transform: rotate(45deg);
      opacity: 0.55;
    }

    /* ─── Monogram ──────────────────────────────────────────── */
    .monogram-wrap {
      width: min(540px, 88vw);
      margin-bottom: 4px;
      animation: floatMono 6s ease-in-out infinite;
      filter: drop-shadow(0 8px 32px rgba(54, 85, 131, 0.13));
    }

    @keyframes floatMono {

      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    .monogram-wrap img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* ─── Coming Soon Label ─────────────────────────────────── */
    .label-top {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--dusty-blue);
      opacity: 0.75;
      margin-bottom: 12px;
      animation: fadeUp 1.6s 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    /* ─── Headline ──────────────────────────────────────────── */
    .headline {
      font-family: 'Tangier', 'Cormorant Garamond', serif;
      font-size: clamp(56px, 11vw, 96px);
      font-weight: normal;
      letter-spacing: 0.04em;
      line-height: 1.05;
      color: var(--dusk-blue);
      margin-bottom: 8px;
      animation: fadeUp 1.6s 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .headline em {
      font-style: italic;
      color: var(--baltic-blue);
    }

    /* ─── Tagline ────────────────────────────────────────────── */
    .tagline {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(14px, 2.5vw, 18px);
      font-weight: 300;
      font-style: italic;
      color: var(--dusty-blue);
      letter-spacing: 0.06em;
      margin-bottom: 38px;
      opacity: 0.85;
      animation: fadeUp 1.6s 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    /* ─── Footer Note ────────────────────────────────────────── */
    .footer-note {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--dusty-blue);
      opacity: 0.5;
      animation: fadeUp 1.6s 0.75s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    /* ─── Responsive ─────────────────────────────────────────── */
    @media (max-height: 700px) {
      .monogram-wrap {
        width: min(240px, 58vw);
      }
    }

    @media (max-width: 400px) {
      .card {
        padding: 0 16px;
      }
    }
  </style>
</head>

<body>

  <!-- Corner SVG Flourishes -->
  <div class="corner corner--tl" aria-hidden="true">
    <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 190 Q10 10 190 10" stroke="#6E8FB3" stroke-width="1" fill="none" />
      <path d="M30 190 Q30 30 190 30" stroke="#B6C7DB" stroke-width="0.7" fill="none" />
      <path d="M10 10 L30 10 L10 30 Z" fill="#6E8FB3" opacity="0.4" />
      <circle cx="10" cy="10" r="3" fill="#365583" opacity="0.5" />
    </svg>
  </div>
  <div class="corner corner--tr" aria-hidden="true">
    <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 190 Q10 10 190 10" stroke="#6E8FB3" stroke-width="1" fill="none" />
      <path d="M30 190 Q30 30 190 30" stroke="#B6C7DB" stroke-width="0.7" fill="none" />
      <path d="M10 10 L30 10 L10 30 Z" fill="#6E8FB3" opacity="0.4" />
      <circle cx="10" cy="10" r="3" fill="#365583" opacity="0.5" />
    </svg>
  </div>
  <div class="corner corner--bl" aria-hidden="true">
    <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 190 Q10 10 190 10" stroke="#6E8FB3" stroke-width="1" fill="none" />
      <path d="M30 190 Q30 30 190 30" stroke="#B6C7DB" stroke-width="0.7" fill="none" />
      <path d="M10 10 L30 10 L10 30 Z" fill="#6E8FB3" opacity="0.4" />
      <circle cx="10" cy="10" r="3" fill="#365583" opacity="0.5" />
    </svg>
  </div>
  <div class="corner corner--br" aria-hidden="true">
    <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 190 Q10 10 190 10" stroke="#6E8FB3" stroke-width="1" fill="none" />
      <path d="M30 190 Q30 30 190 30" stroke="#B6C7DB" stroke-width="0.7" fill="none" />
      <path d="M10 10 L30 10 L10 30 Z" fill="#6E8FB3" opacity="0.4" />
      <circle cx="10" cy="10" r="3" fill="#365583" opacity="0.5" />
    </svg>
  </div>

  <!-- Floating Petals -->
  <div class="petals-canvas" id="petalsCanvas" aria-hidden="true"></div>

  <!-- Main Content -->
  <main class="card" role="main">

    <p class="label-top">A Wedding Website is Coming</p>

    <!-- Monogram Full -->
    <div class="monogram-wrap" aria-label="Rey and Jona monogram">
      <img src="assets/monogram/ReyJona-DuskBlue-Monogram.svg" alt="Rey & Jona monogram">
    </div>

    <!-- Headline -->
    <h1 class="headline">Coming <em>Soon</em></h1>

    <!-- Tagline -->
    <p class="tagline">Something beautiful is being crafted, just for you.</p>

    <!-- Divider -->
    <div class="divider" role="presentation">
      <span class="divider-line"></span>
      <span class="divider-diamond"></span>
      <span class="divider-line"></span>
    </div>

    <!-- Footer Note -->
    <p class="footer-note">Rey &amp; Jona &nbsp;·&nbsp; 2026</p>

  </main>

  <script>
    /* ── Floating Petals ─────────────────────────────────────── */
    const canvas = document.getElementById('petalsCanvas');

    const PETAL_COLORS = [
      'rgba(182,199,219,0.65)',
      'rgba(238,218,201,0.70)',
      'rgba(182,187,181,0.55)',
      'rgba(110,143,179,0.45)',
      'rgba(255,255,255,0.50)',
    ];

    function createPetal() {
      const p = document.createElement('div');
      p.className = 'petal';
      const size = 6 + Math.random() * 10;
      const left = Math.random() * 100;
      const dur = 10 + Math.random() * 18;
      const delay = Math.random() * 20;
      const color = PETAL_COLORS[Math.floor(Math.random() * PETAL_COLORS.length)];
      const rot = Math.random() * 360;
      p.style.cssText = `
        left: ${left}%;
        width: ${size}px;
        height: ${size * 1.4}px;
        background: ${color};
        animation-duration: ${dur}s;
        animation-delay: -${delay}s;
        border-radius: ${Math.random() > 0.5 ? '80% 20% 80% 20%' : '50% 80% 20% 80%'};
        transform: rotate(${rot}deg);
      `;
      canvas.appendChild(p);
    }

    for (let i = 0; i < 28; i++) createPetal();
  </script>

</body>

</html>
